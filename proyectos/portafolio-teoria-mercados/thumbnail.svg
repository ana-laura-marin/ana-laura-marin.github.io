  <circle cx="130" cy="240" r="7" fill="#dc2626"/>
  <text x="140" y="236" font-size="10" fill="#dc2626" font-weight="bold">GMVP</text>

  <!-- Cartera tangente -->
  <polygon points="470,30 462,48 478,48" fill="#f59e0b"/>
  <text x="482" y="34" font-size="10" fill="#f59e0b" font-weight="bold">q (tangente)</text>

