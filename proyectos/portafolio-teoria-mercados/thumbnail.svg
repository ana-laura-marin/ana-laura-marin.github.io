  <circle cx="420" cy="95"  r="4" fill="#64748b" opacity="0.7"/>
  <circle cx="200" cy="200" r="4" fill="#64748b" opacity="0.7"/>
  <circle cx="280" cy="170" r="4" fill="#64748b" opacity="0.7"/>
  <circle cx="350" cy="145" r="4" fill="#64748b" opacity="0.7"/>
  <circle cx="440" cy="125" r="4" fill="#64748b" opacity="0.7"/>
  <circle cx="160" cy="220" r="4" fill="#64748b" opacity="0.7"/>

  <!-- Tasa libre de riesgo -->
  <circle cx="60" cy="272" r="5" fill="#16a34a"/>
