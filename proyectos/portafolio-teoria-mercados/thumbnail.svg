  <line x1="385" y1="242" x2="410" y2="242" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,2"/>
  <text x="416" y="246" font-size="10" fill="#1e293b">Capital Market Line</text>
  <circle cx="397" cy="259" r="5" fill="#64748b" opacity="0.7"/>
