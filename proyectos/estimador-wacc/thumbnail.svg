<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <rect width="600" height="340" fill="#eff6ff"/>

  <!-- Título -->
  <text x="300" y="30" text-anchor="middle" font-size="15" fill="#1e3a8a" font-weight="bold">Estimador de WACC · País · Industria · Apalancamiento</text>

  <!-- Ejes -->
  <line x1="70" y1="285" x2="560" y2="285" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="70" y1="285" x2="70"  y2="60"  stroke="#94a3b8" stroke-width="1.5"/>
  <text x="315" y="315" text-anchor="middle" font-size="11" fill="#64748b">Porcentaje de deuda</text>
  <text x="26" y="175" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90,26,175)">WACC (%)</text>

  <!-- Curva WACC vs deuda (forma de U suave) -->
  <path d="M 110 120 Q 200 175 300 200 Q 400 215 500 175"
        fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- Puntos de escenario -->
  <circle cx="110" cy="120" r="4.5" fill="#2563eb"/>
  <circle cx="200" cy="168" r="4.5" fill="#2563eb"/>
  <circle cx="300" cy="200" r="4.5" fill="#2563eb"/>
  <circle cx="400" cy="212" r="4.5" fill="#2563eb"/>
  <circle cx="500" cy="175" r="4.5" fill="#2563eb"/>

  <!-- Nivel seleccionado resaltado -->
  <circle cx="300" cy="200" r="11" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="300" y="235" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="bold">Nivel seleccionado</text>

  <!-- Barras de composición del WACC -->
  <rect x="420" y="70" width="130" height="70" rx="6" fill="white" opacity="0.9" stroke="#e2e8f0"/>
  <text x="485" y="86" text-anchor="middle" font-size="9" fill="#1e293b" font-weight="bold">Composición</text>
  <rect x="435" y="95" width="14" height="38" fill="#2563eb"/>
  <text x="442" y="146" text-anchor="middle" font-size="8" fill="#64748b">Equity</text>
  <rect x="465" y="112" width="14" height="21" fill="#f59e0b"/>
  <text x="472" y="146" text-anchor="middle" font-size="8" fill="#64748b">Deuda</text>
  <rect x="495" y="100" width="14" height="33" fill="#16a34a"/>
  <text x="502" y="146" text-anchor="middle" font-size="8" fill="#64748b">WACC</text>

  <!-- Fórmula -->
  <text x="315" y="255" text-anchor="middle" font-size="11" fill="#334155" font-style="italic">WACC = Ke · We + Kd · (1 − t) · Wd</text>
</svg>
